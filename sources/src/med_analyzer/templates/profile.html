{% extends 'base.html' %}
{% block title %}{{ t('profile.title') }}{% endblock %}
{% block content %}
<h1>{{ t('profile.title') }}</h1>
<p class="hint">{{ t('profile.hint') }}</p>
{% if error %}
<p class="error" role="alert">{{ error|msg }}</p>
{% endif %}
<form method="post" action="/profile" class="profile-form">
  <fieldset>
    <legend>{{ t('profile.sex') }}</legend>
    <label><input type="radio" name="sex" value="M"{% if sex == 'M' %} checked{% endif %}> {{ t('profile.male') }}</label>
    <label><input type="radio" name="sex" value="F"{% if sex == 'F' %} checked{% endif %}> {{ t('profile.female') }}</label>
  </fieldset>
  <label class="field">{{ t('profile.birth_date') }}
    <input type="date" name="birth_date" value="{{ birth_date }}" min="1900-01-01" required>
  </label>
  <button type="submit">{{ t('profile.save') }}</button>
</form>
{% endblock %}
