---
name: Lint

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          # Keep in step with the ruff rev in .pre-commit-config.yaml.
          version: "0.15.13"
          args: "check sources/"

      - name: Run ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.13"
          args: "format --check sources/"
...

